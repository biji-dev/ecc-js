name: fork-ci

on:
  push:
    branches: [main, 'sync/**', 'slim/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test + fork verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests
        run: npm test

      - name: Verify fork invariants
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # Base for the plugin-build bump check: the PR base, the previous main tip,
          # or the merge-base with main for sync/slim branches.
          if [ -n "$PR_BASE" ]; then
            base="$PR_BASE"
          elif [ "$REF_NAME" = "main" ]; then
            base="$EVENT_BEFORE"
          else
            base=$(git merge-base origin/main HEAD 2>/dev/null || true)
          fi
          FORK_VERIFY_BASE="$base" node fork/bin/verify.js --drift

      - name: Lint markdown
        run: npx markdownlint '**/*.md' --ignore node_modules

      - name: Validate workflow security
        run: node scripts/ci/validate-workflow-security.js
